<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="title"><title id="title">Open the engineering notebook to explore our technology and approach.</title><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#F0EAE2}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.muted{fill:#A6ADB7}.orange{fill:#FE5B2A}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3s ease-in-out infinite}.slow{animation:pulse 5s ease-in-out infinite}
.flow{stroke-dasharray:8 20;animation:flow 5s linear infinite}
.blink{animation:pulse 2.4s steps(2,end) infinite}
.scan{animation:scan 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-112}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(70px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#0B0E14"/></linearGradient><radialGradient id="halo"><stop stop-color="#FE5B2A" stop-opacity=".2"/><stop offset="1" stop-color="#FE5B2A" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs><rect x="1" y="1" width="1198" height="98" rx="16" fill="url(#bg)" stroke="#303742" stroke-width="2"/><rect x="2" y="2" width="1196" height="96" rx="15" fill="url(#grid)" /><text x="32" y="43" font-size="17" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="start">THE ENGINEERING NOTEBOOK</text><text x="32" y="74" font-size="21" font-weight="400" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="start">A closer look at the foundations.</text><rect x="1118" y="30" width="42" height="40" rx="4" fill="#222A35" /><path d="M1130 50h18m-9 -9v18" fill="none" stroke="#FE5B2A" stroke-width="2" /></svg>