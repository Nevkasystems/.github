<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">Our delivery process: discover, design, build, launch, and evolve.</title><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#F0EAE2}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.muted{fill:#A6ADB7}.orange{fill:#FE5B2A}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3s ease-in-out infinite}.slow{animation:pulse 5s ease-in-out infinite}
.flow{stroke-dasharray:8 20;animation:flow 5s linear infinite}
.blink{animation:pulse 2.4s steps(2,end) infinite}
.scan{animation:scan 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-112}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(70px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#0B0E14"/></linearGradient><radialGradient id="halo"><stop stop-color="#FE5B2A" stop-opacity=".2"/><stop offset="1" stop-color="#FE5B2A" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs><rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#bg)" stroke="#303742" stroke-width="2"/><rect x="2" y="2" width="1196" height="356" rx="15" fill="url(#grid)" /><text x="48" y="55" font-size="16" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="start">INSIDE THE LAB</text><text x="48" y="108" font-size="36" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="start">From the first question to the next release.</text><path d="M118 195H1082" fill="none" stroke="#3D4B5C" stroke-width="3" /><path d="M118 195H1082" fill="none" stroke="#FE5B2A" stroke-width="3" class="flow"/><rect x="93" y="172" width="46" height="46" rx="7" fill="#18212B" stroke="#FE5B2A" stroke-width="2"/><text x="116" y="202" font-size="18" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="middle">01</text><text x="116" y="260" font-size="26" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="middle">Discover</text><text x="116" y="293" font-size="15" font-weight="400" fill="#A6ADB7" style="fill:#A6ADB7" class="" text-anchor="middle">Understand the problem</text><rect x="334" y="172" width="46" height="46" rx="7" fill="#18212B" stroke="#FE5B2A" stroke-width="2"/><text x="357" y="202" font-size="18" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="middle">02</text><text x="357" y="260" font-size="26" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="middle">Design</text><text x="357" y="293" font-size="15" font-weight="400" fill="#A6ADB7" style="fill:#A6ADB7" class="" text-anchor="middle">Shape the experience</text><rect x="575" y="172" width="46" height="46" rx="7" fill="#18212B" stroke="#FE5B2A" stroke-width="2"/><text x="598" y="202" font-size="18" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="middle">03</text><text x="598" y="260" font-size="26" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="middle">Build</text><text x="598" y="293" font-size="15" font-weight="400" fill="#A6ADB7" style="fill:#A6ADB7" class="" text-anchor="middle">Engineer and test</text><rect x="816" y="172" width="46" height="46" rx="7" fill="#18212B" stroke="#FE5B2A" stroke-width="2"/><text x="839" y="202" font-size="18" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="middle">04</text><text x="839" y="260" font-size="26" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="middle">Launch</text><text x="839" y="293" font-size="15" font-weight="400" fill="#A6ADB7" style="fill:#A6ADB7" class="" text-anchor="middle">Prepare the release</text><rect x="1057" y="172" width="46" height="46" rx="7" fill="#18212B" stroke="#FE5B2A" stroke-width="2"/><text x="1080" y="202" font-size="18" font-weight="400" fill="#FE5B2A" style="fill:#FE5B2A" class="mono" text-anchor="middle">05</text><text x="1080" y="260" font-size="26" font-weight="700" fill="#F0EAE2" style="fill:#F0EAE2" class="" text-anchor="middle">Evolve</text><text x="1080" y="293" font-size="15" font-weight="400" fill="#A6ADB7" style="fill:#A6ADB7" class="" text-anchor="middle">Learn and improve</text></svg>