<svg xmlns="http://www.w3.org/2000/svg" width="302" height="56" viewBox="0 0 302 56" role="img" aria-labelledby="title"><title id="title">Start a conversation</title><defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#F0EAE2}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.muted{fill:#A6ADB7}.orange{fill:#FE5B2A}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3s ease-in-out infinite}.slow{animation:pulse 5s ease-in-out infinite}
.flow{stroke-dasharray:8 20;animation:flow 5s linear infinite}
.blink{animation:pulse 2.4s steps(2,end) infinite}
.scan{animation:scan 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-112}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translateY(70px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111722"/><stop offset="1" stop-color="#0B0E14"/></linearGradient><radialGradient id="halo"><stop stop-color="#FE5B2A" stop-opacity=".2"/><stop offset="1" stop-color="#FE5B2A" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs><rect x="1" y="1" width="300" height="54" rx="6" fill="#FE5B2A" stroke="#FE5B2A"/><text x="20" y="35" font-size="19" font-weight="700" fill="#0B0E14" style="fill:#0B0E14" class="" text-anchor="start">Start a conversation</text><path d="M264 28h15m-6 -6 6 6-6 6" fill="none" stroke="#0B0E14" stroke-width="2" /></svg>